<head>

    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎨 Kids Coloring Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rainbow-1: #FF6B6B;
            --rainbow-2: #FFE66D;
            --rainbow-3: #4ECDC4;
            --rainbow-4: #A78BFA;
            --rainbow-5: #FF9FF3;
            --rainbow-6: #54A0FF;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow-soft: 0 4px 15px rgba(0, 0, 0, 0.1);
            --shadow-strong: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg-gradient);
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overscroll-behavior: none;
            user-select: none;
        }

        /* ===== 頂部工具列 ===== */
        #toolbar {
            height: 60px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            box-shadow: var(--shadow-soft);
            z-index: 100;
            flex-shrink: 0;
            border-radius: 0 0 20px 20px;
            overflow: hidden;
        }

        .tool-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* 危險操作（清除）額外間距 */
        .btn-clear {
            margin-left: 8px;
        }

        .btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 14px;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(145deg, #f0f0f0, #e6e6e6);
            box-shadow: 3px 3px 8px #d1d1d1, -3px -3px 8px #ffffff;
        }

        .btn:active {
            transform: scale(0.9);
            box-shadow: inset 2px 2px 5px #d1d1d1, inset -2px -2px 5px #ffffff;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            filter: grayscale(100%);
            transform: scale(0.95);
        }

        .btn.active {
            background: linear-gradient(145deg, var(--rainbow-3), #3dbdb4);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
        }

        /* 統一動作按鈕樣式 */
        .btn-action {
            width: auto;
            min-width: 72px;
            height: 44px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 12px;
            white-space: nowrap;
        }

        .btn-action .btn-icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        .btn-action .btn-label {
            font-size: 0.85rem;
        }

        /* 儲存按鈕 */
        .btn-save {
            background: linear-gradient(145deg, #4CD964, #3ec256);
            color: white;
            box-shadow: 0 3px 12px rgba(76, 217, 100, 0.35);
        }

        .btn-save:active {
            background: linear-gradient(145deg, #3ec256, #4CD964);
        }

        /* 分享按鈕 */
        .btn-share {
            background: linear-gradient(145deg, #54A0FF, #4090ea);
            color: white;
            box-shadow: 0 3px 12px rgba(84, 160, 255, 0.35);
        }

        /* 響應式：小螢幕隱藏文字 */
        @media (max-width: 360px) {
            .btn-action {
                min-width: 44px;
                padding: 0 10px;
            }
            .btn-action .btn-label {
                display: none;
            }
        }

        .btn-clear {
            background: linear-gradient(145deg, var(--rainbow-1), #e55a5a);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        /* ===== 工具模式選擇 ===== */
        #mode-selector {
            height: auto;
            min-height: 64px;
            background: var(--card-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            margin: 8px 12px;
            border-radius: 18px;
            box-shadow: var(--shadow-soft);
            flex-shrink: 0;
        }

        /* 工具按鈕 - 垂直排列 icon + label */
        .mode-btn {
            flex: 1;
            max-width: 110px;
            min-width: 80px;
            height: 52px;
            padding: 6px 10px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: #f5f5f5;
            position: relative;
            overflow: hidden;
        }

        .mode-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, var(--rainbow-4), var(--rainbow-5));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mode-btn.active::before {
            opacity: 1;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border: 3px solid #6366f1;
            box-shadow: 
                0 0 0 2px white,
                0 4px 12px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
            color: #333;
        }

        .mode-btn span {
            position: relative;
            z-index: 1;
        }

        .mode-icon {
            font-size: 1.4rem;
            line-height: 1.2;
        }

        .mode-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #666;
        }

        /* 選中狀態文字變色 */
        .mode-btn.active .mode-label {
            color: #4338ca;
            font-weight: 800;
        }

        /* ===== 圖片導覽列 ===== */
        #image-nav {
            height: 96px;
            background: var(--card-bg);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            margin: 0 12px 8px;
            border-radius: 18px;
            box-shadow: var(--shadow-soft);
            flex-shrink: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #image-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            flex-shrink: 0;
        }

        .nav-thumb:active {
            transform: scale(0.92);
        }

        .nav-thumb.active {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
            transform: scale(1.05);
        }

        /* ===== 畫布容器 ===== */
        #canvas-container {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 12px;
            margin: 0 12px;
        }

        #canvas-wrapper {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-strong);
        }

        canvas {
            display: block;
            background: white;
            touch-action: none;
            /* 尺寸由 JS syncCanvasSize() 控制，不使用 max-width/max-height */
        }
        
        #base-canvas {
            /* 確保 baseCanvas 尺寸由 JS 控制 */
            max-width: none;
            max-height: none;
        }

        #drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            background: transparent !important;
            pointer-events: auto;
            /* 重要：覆蓋通用 canvas 的 max-width/max-height，讓 JS 可以控制實際尺寸 */
            max-width: none !important;
            max-height: none !important;
            /* 尺寸由 JS syncCanvasSize() 控制，確保與 baseCanvas 一致 */
        }

        /* ===== 載入動畫 ===== */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #loading-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 6px solid #f0f0f0;
            border-top-color: var(--rainbow-4);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #666;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 筆刷大小滑桿 ===== */
        #brush-size-container {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 8px 15px;
            margin: 0 12px 8px;
            border-radius: 14px;
            box-shadow: var(--shadow-soft);
        }

        #brush-size-container.visible {
            display: flex;
        }

        #brush-size-container label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
            white-space: nowrap;
        }

        #brush-size {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, var(--rainbow-3), var(--rainbow-4));
            border-radius: 4px;
            outline: none;
        }

        #brush-size::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        #brush-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #brush-preview-dot {
            border-radius: 50%;
            background: white;
        }

        /* ===== 底部色票區 ===== */
        #palette {
            min-height: 80px;
            max-height: 100px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            background: var(--card-bg);
            padding: 12px 15px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            position: relative;
        }

        #palette::-webkit-scrollbar {
            display: none;
        }

        /* 右側漸變提示（滾動提示） */
        #palette::after {
            content: "";
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 40px;
            background: linear-gradient(to right, transparent, rgba(99, 102, 241, 0.2));
            pointer-events: none;
            border-radius: 0 24px 0 0;
        }

        .color-swatch {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            cursor: pointer;
        }

        .color-swatch:active {
            transform: scale(0.92);
        }

        .color-swatch.active {
            width: 52px;
            height: 52px;
            border: 4px solid #333;
            box-shadow: 
                0 0 0 3px white,
                0 0 0 6px #333,
                0 4px 12px rgba(0,0,0,0.3);
            transform: scale(1.1);
        }

        /* ===== 分享選單 ===== */
        #share-menu {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #share-menu.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #share-panel {
            background: white;
            width: 100%;
            max-width: 400px;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #share-menu.visible #share-panel {
            transform: translateY(0);
        }

        .share-title {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #333;
        }

        .share-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .share-btn {
            width: 70px;
            height: 70px;
            border: none;
            border-radius: 20px;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s;
        }

        .share-btn:active {
            transform: scale(0.9);
        }

        .share-btn span {
            font-size: 0.7rem;
            font-weight: 600;
        }

        .share-btn.copy { 
            background: linear-gradient(145deg, #A78BFA, #8B5CF6); 
            color: white;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.4);
        }
        .share-btn.download { background: #f0f0f0; color: #333; }

        .share-close {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 14px;
            background: #f0f0f0;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 15px;
            cursor: pointer;
        }

        /* ===== 確認 Modal ===== */
        #confirm-modal {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 80px;
            z-index: 200;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        #confirm-modal.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #confirm-panel {
            background: white;
            border-radius: 24px;
            padding: 24px 20px;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #confirm-modal.visible #confirm-panel {
            transform: scale(1);
        }

        .confirm-title {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #333;
        }

        .confirm-message {
            text-align: center;
            font-size: 1rem;
            color: #666;
            margin-bottom: 24px;
        }

        .confirm-buttons {
            display: flex;
            gap: 12px;
        }

        .confirm-btn {
            flex: 1;
            height: 52px;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .confirm-btn:active {
            transform: scale(0.95);
        }

        .confirm-cancel {
            background: #f0f0f0;
            color: #666;
        }

        .confirm-ok {
            background: linear-gradient(145deg, #FF6B6B, #e55a5a);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        /* ===== 填色成功動畫 ===== */
        .fill-burst {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 60;
        }

        .fill-burst::before,
        .fill-burst::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            animation: burst 0.5s ease-out forwards;
        }

        .fill-burst::before {
            border: 3px solid var(--rainbow-2);
        }

        .fill-burst::after {
            border: 3px solid var(--rainbow-5);
            animation-delay: 0.1s;
        }

        @keyframes burst {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        /* ===== Toast 通知 ===== */
        #toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            z-index: 300;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 點擊回饋動畫 ===== */
        .clickable:active,
        .btn:active,
        .mode-btn:active,
        .color-swatch:active,
        .nav-thumb:active,
        .share-btn:active,
        .confirm-btn:active {
            transform: scale(0.92);
        }

        /* ===== 響應式 ===== */
        @media (min-width: 768px) {
            #toolbar { height: 70px; padding: 0 20px; }
            .btn { width: 52px; height: 52px; font-size: 1.5rem; }
            #mode-selector { min-height: 72px; margin: 12px 20px; gap: 14px; }
            .mode-btn { max-width: 130px; height: 58px; }
            .mode-icon { font-size: 1.6rem; }
            .mode-label { font-size: 0.85rem; }
            #image-nav { height: 100px; margin: 0 20px 12px; }
            .nav-thumb { width: 90px; height: 90px; }
            #canvas-container { padding: 20px; margin: 0 20px; }
            #palette { min-height: 90px; padding: 15px 20px; }
            .color-swatch { width: 52px; height: 52px; }
            .color-swatch.active { width: 60px; height: 60px; }
        }

        /* ===== 手機橫向模式 - 左右佈局 ===== */
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                flex-direction: row;
                overflow: hidden;
            }

            /* 左側面板：工具列 + 模式選擇 */
            #toolbar {
                flex-direction: column;
                width: 56px;
                height: 100%;
                min-height: 100%;
                padding: 8px 6px;
                border-radius: 0 16px 16px 0;
                justify-content: flex-start;
                gap: 8px;
            }

            #toolbar .tool-group {
                flex-direction: column;
                gap: 6px;
            }

            #toolbar .btn {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }

            #toolbar .btn-action {
                min-width: 40px;
                width: 40px;
                height: 40px;
                padding: 0;
            }

            #toolbar .btn-action .btn-label {
                display: none;
            }

            #toolbar .btn-clear {
                margin-left: 0;
                margin-top: 8px;
            }

            /* 模式選擇器 - 橫向時垂直排列在左側 */
            #mode-selector {
                position: fixed;
                left: 62px;
                top: 50%;
                transform: translateY(-50%);
                flex-direction: column;
                width: auto;
                min-height: auto;
                height: auto;
                margin: 0;
                padding: 8px;
                gap: 6px;
                border-radius: 14px;
                z-index: 90;
            }

            #mode-selector .mode-btn {
                width: 48px;
                min-width: 48px;
                max-width: 48px;
                height: 48px;
                padding: 4px;
            }

            #mode-selector .mode-label {
                display: none;
            }

            #mode-selector .mode-icon {
                font-size: 1.3rem;
            }

            /* 筆刷大小 - 橫向時在模式選擇器下方 */
            #brush-size-container {
                position: fixed;
                left: 62px;
                bottom: 10px;
                flex-direction: column;
                width: 54px;
                margin: 0;
                padding: 8px;
                gap: 6px;
                border-radius: 12px;
            }

            #brush-size-container label {
                font-size: 0.75rem;
            }

            #brush-size-container #brush-size {
                writing-mode: vertical-lr;
                direction: rtl;
                width: 6px;
                height: 60px;
            }

            #brush-size-container #brush-preview {
                width: 24px;
                height: 24px;
            }

            /* 圖片導覽 - 橫向時隱藏（節省空間） */
            #image-nav {
                display: none;
            }

            /* 畫布容器 - 最大化 */
            #canvas-container {
                flex: 1;
                margin: 8px;
                padding: 8px;
                min-width: 0;
            }

            /* 右側色票面板 - 垂直排列 */
            #palette {
                flex-direction: column;
                width: 56px;
                min-height: 100%;
                height: 100%;
                max-height: 100%;
                padding: 10px 6px;
                padding-right: calc(6px + env(safe-area-inset-right));
                border-radius: 16px 0 0 16px;
                overflow-y: auto;

            #palette::after {

            #palette .color-swatch {

            #palette .color-swatch.active {

            /* 分享選單調整 */
            #share-menu #share-panel {

            }
        }

        /* 橫向模式下的圖片選擇浮動按鈕 */
        @media (orientation: landscape) and (max-height: 500px) {
            /* 在畫布下方顯示小型圖片切換器 */
            #canvas-container::after {
                content: '';
                position: absolute;
                bottom: 4px;
                left: 50%;
                transform: translateX(-50%);
                width: 60px;
                height: 4px;
                background: rgba(255,255,255,0.5);
                border-radius: 2px;
            }
        }

<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W2FV7ZPZ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <!-- 頂部工具列 -->
    <div id="toolbar">
        <div class="tool-group">
            <button id="btn-undo" class="btn" title="復原">↩️</button>
            <button id="btn-redo" class="btn" title="重做">↪️</button>
            <button id="btn-clear" class="btn btn-clear" title="清除重來">🗑️</button>
        </div>
        <div class="tool-group">
            <button id="btn-share" class="btn btn-action btn-share" title="分享">
                <span class="btn-icon">📤</span>
                <span class="btn-label">分享</span>
            </button>
            <button id="btn-save" class="btn btn-action btn-save" title="儲存">
                <span class="btn-icon">💾</span>
                <span class="btn-label">儲存</span>
            </button>
        </div>
    </div>

    <!-- 工具模式選擇 -->
    <div id="mode-selector">
        <button class="mode-btn active" data-mode="fill">
            <span class="mode-icon">🪣</span>
            <span class="mode-label">填色</span>
        </button>
        <button class="mode-btn" data-mode="brush">
            <span class="mode-icon">🖌️</span>
            <span class="mode-label">畫筆</span>
        </button>
        <button class="mode-btn" data-mode="eraser">
            <span class="mode-icon">🧹</span>
            <span class="mode-label">橡皮擦</span>
        </button>
    </div>

    <!-- 筆刷大小調整 -->
    <div id="brush-size-container">
        <label>✏️ 大小</label>
        <input type="range" id="brush-size" min="2" max="40" value="8">
        <div id="brush-preview"><div id="brush-preview-dot"></div></div>
    </div>

    <!-- 圖片導覽列 -->
    <div id="image-nav"></div>

    <!-- 畫布區域 -->
    <div id="canvas-container">
        <div id="canvas-wrapper">
            <canvas id="base-canvas"></canvas>
            <canvas id="drawing-canvas"></canvas>
            <div id="loading-overlay">
                <div class="loader"></div>
                <div class="loading-text">載入中...</div>
            </div>
        </div>
    </div>

    <!-- 底部色票 -->
    <div id="palette"></div>

    <!-- 分享選單 -->
    <div id="share-menu">
        <div id="share-panel">
            <div class="share-title">🎉 分享你的作品！</div>
            <div class="share-options">
                <button class="share-btn copy" data-share="copy">📋<span>複製</span></button>
                <button class="share-btn download" data-share="download">💾<span>下載</span></button>
            </div>
            <button class="share-close">取消</button>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast"></div>

    <!-- 確認 Modal -->
    <div id="confirm-modal">
        <div id="confirm-panel">
            <div class="confirm-title" id="confirm-title">🗑️ 確定要清除嗎？</div>
            <div class="confirm-message" id="confirm-message">你的著色會全部消失喔！</div>
            <div class="confirm-buttons">
                <button class="confirm-btn confirm-cancel" id="confirm-cancel">取消</button>
                <button class="confirm-btn confirm-ok" id="confirm-ok">🗑️ 清除</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 設定 =====
        const IMAGES = ['img1.png', 'img2.png', 'img3.png', 'img4.png', 'img5.png'];
        const CANVAS_SIZE = 800;
        const MAX_HISTORY = 15;
        const TOLERANCE = 50;
        const LINE_THRESHOLD = 50;
        const AUTOSAVE_KEY = 'kidsColoringApp_v2';

        // ===== 音效系統 (Web Audio API) =====
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.init();
            }

            init() {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio API 不支援');
                    this.enabled = false;
                }
            }

            resume() {
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            // 泡泡音
            playBubble(pitch = 1) {
                if (!this.enabled || !this.ctx) return;
                this.resume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600 * pitch, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200 * pitch, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            // 填色音
            playFill() {
                this.playBubble(1.2);
                setTimeout(() => this.playBubble(1.5), 50);
            }

            // 切換音
            playSwitch() {
                this.playBubble(0.8);
            }

            // 儲存音
            playSave() {
                this.playBubble(1);
                setTimeout(() => this.playBubble(1.3), 100);
                setTimeout(() => this.playBubble(1.6), 200);
            }

            // 清除音
            playClear() {
                if (!this.enabled || !this.ctx) return;
                this.resume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            // 錯誤音
            playError() {
                if (!this.enabled || !this.ctx) return;
                this.resume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
        }

        const sound = new SoundManager();

        // ===== DOM 元素 =====
        const baseCanvas = document.getElementById('base-canvas');
        const drawCanvas = document.getElementById('drawing-canvas');
        const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });
        const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
        const paletteEl = document.getElementById('palette');
        const navEl = document.getElementById('image-nav');
        const loadingEl = document.getElementById('loading-overlay');
        const brushSizeContainer = document.getElementById('brush-size-container');
        const brushSizeInput = document.getElementById('brush-size');
        const brushPreviewDot = document.getElementById('brush-preview-dot');
        const shareMenu = document.getElementById('share-menu');
        const toastEl = document.getElementById('toast');

        const btnUndo = document.getElementById('btn-undo');
        const btnRedo = document.getElementById('btn-redo');
        const btnClear = document.getElementById('btn-clear');
        const btnSave = document.getElementById('btn-save');
        const btnShare = document.getElementById('btn-share');
        const modeBtns = document.querySelectorAll('.mode-btn');

        // ===== 狀態 =====
        let currentImageIndex = 0;
        let currentMode = 'fill'; // fill, brush, eraser
        let currentColor = [255, 59, 48, 255];
        let brushSize = 8;
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let historyStack = [];
        let redoStack = [];

        // ===== 同步 Canvas 尺寸 =====
        // 確保兩個 canvas 的顯示尺寸完全一致，且適應容器大小
        let resizeTimer;
        
        function syncCanvasSize() {
            const container = document.getElementById('canvas-container');
            const containerRect = container.getBoundingClientRect();
            
            // 防護：尺寸為 0 時不處理（佈局尚未完成）
            if (containerRect.width === 0 || containerRect.height === 0) return;
            
            // 計算容器可用空間（扣除 padding）
            const containerStyle = window.getComputedStyle(container);
            const paddingX = parseFloat(containerStyle.paddingLeft) + parseFloat(containerStyle.paddingRight);
            const paddingY = parseFloat(containerStyle.paddingTop) + parseFloat(containerStyle.paddingBottom);
            const availableWidth = containerRect.width - paddingX;
            const availableHeight = containerRect.height - paddingY;
            
            // 計算保持 1:1 比例的最大尺寸
            const size = Math.min(availableWidth, availableHeight);
            
            // 設定兩個 canvas 的 CSS 尺寸
            baseCanvas.style.width = size + 'px';
            baseCanvas.style.height = size + 'px';
            drawCanvas.style.width = size + 'px';
            drawCanvas.style.height = size + 'px';
        }
        
        // 確保佈局完成後才同步（雙重 rAF）
        function syncCanvasSizeDeferred() {
            requestAnimationFrame(() => {
                requestAnimationFrame(syncCanvasSize);
            });
        }

        // ===== 初始化 =====
        function init() {
            baseCanvas.width = drawCanvas.width = CANVAS_SIZE;
            baseCanvas.height = drawCanvas.height = CANVAS_SIZE;

            createPalette();
            createImageNav();
            loadImage(currentImageIndex);
            updateUI();
            updateBrushPreview();

            // 事件監聽
            drawCanvas.addEventListener('pointerdown', handlePointerDown);
            drawCanvas.addEventListener('pointermove', handlePointerMove);
            drawCanvas.addEventListener('pointerup', handlePointerUp);
            drawCanvas.addEventListener('pointerleave', handlePointerUp);

            btnUndo.addEventListener('click', undo);
            btnRedo.addEventListener('click', redo);
            btnClear.addEventListener('click', clearCanvas);
            btnSave.addEventListener('click', () => saveImage());
            btnShare.addEventListener('click', () => toggleShareMenu(true));

            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => setMode(btn.dataset.mode));
            });

            brushSizeInput.addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value);
                updateBrushPreview();
            });

            document.querySelector('.share-close').addEventListener('click', () => toggleShareMenu(false));
            shareMenu.addEventListener('click', (e) => {
                if (e.target === shareMenu) toggleShareMenu(false);
            });

            document.querySelectorAll('.share-btn').forEach(btn => {
                btn.addEventListener('click', () => handleShare(btn.dataset.share));
            });

            // 色票滾輪
            paletteEl.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    paletteEl.scrollLeft += e.deltaY;
                }
            }, { passive: false });

            // 注意：loadSavedProgress 已在 loadImage.onload 中調用，這裡不重複

            // 視窗大小改變時重新同步 canvas 尺寸（加 debounce）
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(syncCanvasSizeDeferred, 100);
            });
            
            // 螢幕旋轉時重新同步
            window.addEventListener('orientationchange', () => {
                setTimeout(syncCanvasSizeDeferred, 100);
            });
        }

        // ===== 建立色票 =====
        function createPalette() {
            const colors = [
                [255, 59, 48], [255, 105, 180], [255, 182, 193], [220, 20, 60],
                [255, 149, 0], [255, 165, 0], [255, 204, 0], [255, 255, 0], [240, 230, 140],
                [255, 228, 196], [255, 218, 185], [210, 180, 140], [139, 69, 19],
                [76, 217, 100], [124, 252, 0], [34, 139, 34], [0, 128, 128],
                [90, 200, 250], [0, 191, 255], [0, 122, 255], [0, 0, 139],
                [88, 86, 214], [148, 0, 211], [221, 160, 221],
                [255, 255, 255], [211, 211, 211], [150, 150, 150],
                [105, 105, 105], [60, 60, 60], [30, 30, 30]
            ];

            colors.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = `color-swatch ${i === 0 ? 'active' : ''}`;
                div.style.backgroundColor = `rgb(${c[0]},${c[1]},${c[2]})`;
                div.addEventListener('click', () => selectColor(c, div));
                paletteEl.appendChild(div);
            });
        }

        function selectColor(color, el) {
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            currentColor = [...color, 255];
            sound.playSwitch();

            // 如果是選顏色，自動切到畫筆或填色模式
            if (currentMode === 'eraser') {
                setMode('brush');
            }
        }

        // ===== 建立圖片導覽 =====
        function createImageNav() {
            navEl.innerHTML = '';
            IMAGES.forEach((src, i) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = `nav-thumb ${i === currentImageIndex ? 'active' : ''}`;
                img.addEventListener('click', () => switchImage(i));
                navEl.appendChild(img);
            });
        }

        function switchImage(index) {
            if (index === currentImageIndex) return;

            // 先存當前進度
            saveProgress();

            currentImageIndex = index;
            document.querySelectorAll('.nav-thumb').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            historyStack = [];
            redoStack = [];
            updateUI();
            loadImage(index);
            sound.playSwitch();
        }

        // ===== 載入圖片 =====
        function loadImage(index) {
            showLoading(true);

            const img = new Image();
            img.src = IMAGES[index];

            img.onload = () => {
                console.log('Image loaded:', IMAGES[index]);
                // 清空畫布
                baseCtx.fillStyle = 'white';
                baseCtx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                drawCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                // 置中繪製線稿
                const scale = Math.min(CANVAS_SIZE / img.width, CANVAS_SIZE / img.height);
                const w = img.width * scale;
                const h = img.height * scale;
                const x = (CANVAS_SIZE - w) / 2;
                const y = (CANVAS_SIZE - h) / 2;
                baseCtx.drawImage(img, x, y, w, h);

                // 嘗試載入已存的進度
                loadSavedProgress();
                showLoading(false);
                
                // 同步 drawCanvas 尺寸與 baseCanvas（等 DOM 更新後）
                syncCanvasSizeDeferred();
            };

            img.onerror = (e) => {
                console.error('Image load error:', IMAGES[index], e);
                showLoading(false);
                showToast('❌ 圖片載入失敗');
                sound.playError();
            };
        }

        // ===== 模式切換 =====
        function setMode(mode) {
            currentMode = mode;
            modeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            // 顯示/隱藏筆刷大小調整
            brushSizeContainer.classList.toggle('visible', mode === 'brush' || mode === 'eraser');

            // 更新游標
            if (mode === 'fill') {
                drawCanvas.style.cursor = 'crosshair';
            } else if (mode === 'brush') {
                drawCanvas.style.cursor = 'crosshair';
            } else if (mode === 'eraser') {
                drawCanvas.style.cursor = 'crosshair';
            }

            sound.playSwitch();
        }

        function updateBrushPreview() {
            const size = Math.max(4, brushSize * 0.6);
            brushPreviewDot.style.width = size + 'px';
            brushPreviewDot.style.height = size + 'px';
        }

        // ===== 指標事件處理 =====
        function handlePointerDown(e) {
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);

            if (currentMode === 'fill') {
                floodFill(x, y, currentColor);
            } else {
                isDrawing = true;
                lastX = x;
                lastY = y;
                saveState();
                draw(x, y, true); // true = 第一個點，畫圓點
            }
        }

        function handlePointerMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const { x, y } = getCanvasCoords(e);
            draw(x, y, false); // 連續繪製，不是第一個點
            lastX = x;
            lastY = y;
        }

        function handlePointerUp() {
            if (isDrawing) {
                isDrawing = false;
                autoSave();
            }
        }

        function getCanvasCoords(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const scaleX = CANVAS_SIZE / rect.width;
            const scaleY = CANVAS_SIZE / rect.height;
            return {
                x: Math.floor((e.clientX - rect.left) * scaleX),
                y: Math.floor((e.clientY - rect.top) * scaleY)
            };
        }

        // ===== 繪製 =====
        function draw(x, y, isFirstPoint = false) {
            if (currentMode === 'eraser') {
                drawCtx.globalCompositeOperation = 'destination-out';
                drawCtx.strokeStyle = 'rgba(255,255,255,1)';
                drawCtx.fillStyle = 'rgba(255,255,255,1)';
            } else {
                drawCtx.globalCompositeOperation = 'source-over';
                drawCtx.strokeStyle = `rgb(${currentColor[0]},${currentColor[1]},${currentColor[2]})`;
                drawCtx.fillStyle = `rgb(${currentColor[0]},${currentColor[1]},${currentColor[2]})`;
            }

            // 如果是第一個點，畫一個圓點
            if (isFirstPoint) {
                drawCtx.beginPath();
                drawCtx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
                drawCtx.fill();
            } else {
                drawCtx.beginPath();
                drawCtx.lineCap = 'round';
                drawCtx.lineJoin = 'round';
                drawCtx.lineWidth = brushSize;
                drawCtx.moveTo(lastX, lastY);
                drawCtx.lineTo(x, y);
                drawCtx.stroke();
            }
        }

        // ===== 填色 (Flood Fill) =====
        function floodFill(startX, startY, fillColor) {
            // 合併兩層畫布來判斷
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = CANVAS_SIZE;
            tempCanvas.height = CANVAS_SIZE;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(baseCanvas, 0, 0);
            tempCtx.drawImage(drawCanvas, 0, 0);

            const imageData = tempCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            const pixels = imageData.data;
            const startPos = (startY * CANVAS_SIZE + startX) * 4;
            const startR = pixels[startPos];
            const startG = pixels[startPos + 1];
            const startB = pixels[startPos + 2];

            // 點擊相似顏色或線條 -> 不處理
            if (colorsAreSimilar(startR, startG, startB, fillColor[0], fillColor[1], fillColor[2], 20)) return;
            if (isBlackOutline(startR, startG, startB)) return;

            saveState();

            const visited = new Uint8Array(CANVAS_SIZE * CANVAS_SIZE);
            const queue = [[startX, startY]];
            const fillPixels = [];

            while (queue.length > 0) {
                const [x, y] = queue.shift();
                const idx = y * CANVAS_SIZE + x;

                if (visited[idx]) continue;
                visited[idx] = 1;

                const pos = idx * 4;
                const r = pixels[pos];
                const g = pixels[pos + 1];
                const b = pixels[pos + 2];

                if (isBlackOutline(r, g, b)) continue;

                if (colorsAreSimilar(r, g, b, startR, startG, startB, TOLERANCE)) {
                    fillPixels.push([x, y]);

                    if (x > 0) queue.push([x - 1, y]);
                    if (x < CANVAS_SIZE - 1) queue.push([x + 1, y]);
                    if (y > 0) queue.push([x, y - 1]);
                    if (y < CANVAS_SIZE - 1) queue.push([x, y + 1]);
                }
            }

            // 在繪製層填色
            if (fillPixels.length > 0) {
                const drawImageData = drawCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                const drawPixels = drawImageData.data;

                fillPixels.forEach(([x, y]) => {
                    const pos = (y * CANVAS_SIZE + x) * 4;
                    drawPixels[pos] = fillColor[0];
                    drawPixels[pos + 1] = fillColor[1];
                    drawPixels[pos + 2] = fillColor[2];
                    drawPixels[pos + 3] = 255;
                });

                drawCtx.putImageData(drawImageData, 0, 0);

                // 動畫和音效
                showFillBurst(startX, startY);
                sound.playFill();
                autoSave();
            }
        }

        function colorsAreSimilar(r1, g1, b1, r2, g2, b2, tol) {
            return (Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2)) <= tol;
        }

        function isBlackOutline(r, g, b) {
            return r < LINE_THRESHOLD && g < LINE_THRESHOLD && b < LINE_THRESHOLD;
        }

        // ===== 填色動畫 =====
        function showFillBurst(canvasX, canvasY) {
            const rect = drawCanvas.getBoundingClientRect();
            const scaleX = rect.width / CANVAS_SIZE;
            const scaleY = rect.height / CANVAS_SIZE;

            const burst = document.createElement('div');
            burst.className = 'fill-burst';
            burst.style.left = (rect.left + canvasX * scaleX - 20) + 'px';
            burst.style.top = (rect.top + canvasY * scaleY - 20) + 'px';
            burst.style.setProperty('--rainbow-2', `rgb(${currentColor[0]},${currentColor[1]},${currentColor[2]})`);
            document.body.appendChild(burst);

            setTimeout(() => burst.remove(), 600);
        }

        // ===== 歷史記錄 =====
        function saveState() {
            redoStack = [];
            if (historyStack.length >= MAX_HISTORY) historyStack.shift();
            historyStack.push(drawCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE));
            updateUI();
        }

        function undo() {
            if (historyStack.length === 0) return;
            sound.playSwitch();
            redoStack.push(drawCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE));
            const prev = historyStack.pop();
            drawCtx.putImageData(prev, 0, 0);
            updateUI();
            autoSave();
        }

        function redo() {
            if (redoStack.length === 0) return;
            sound.playSwitch();
            historyStack.push(drawCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE));
            const next = redoStack.pop();
            drawCtx.putImageData(next, 0, 0);
            updateUI();
            autoSave();
        }

        function clearCanvas() {
            // 防雙擊：開啟 modal 時禁用按鈕
            if (btnClear.disabled) return;
            btnClear.disabled = true;

            showConfirmModal({
                title: '🗑️ 確定要清除嗎？',
                message: '你的著色會全部消失喔！',
                confirmText: '🗑️ 清除',
                onConfirm: () => {
                    saveState();
                    drawCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    sound.playClear();
                    showToast('🗑️ 已清除');
                    autoSave();
                    btnClear.disabled = false;
                },
                onCancel: () => {
                    btnClear.disabled = false;
                }
            });
        }

        // ===== 確認 Modal =====
        const confirmModal = document.getElementById('confirm-modal');
        const confirmTitle = document.getElementById('confirm-title');
        const confirmMessage = document.getElementById('confirm-message');
        const confirmOkBtn = document.getElementById('confirm-ok');
        const confirmCancelBtn = document.getElementById('confirm-cancel');

        let currentConfirmCallbacks = { onConfirm: null, onCancel: null };

        function showConfirmModal(options) {
            const { title, message, confirmText, onConfirm, onCancel } = options;

            confirmTitle.textContent = title || '確定嗎？';
            confirmMessage.textContent = message || '';
            confirmOkBtn.textContent = confirmText || '確定';
            currentConfirmCallbacks = { onConfirm, onCancel };

            confirmModal.classList.add('visible');
            sound.playSwitch();
        }

        function hideConfirmModal(confirmed) {
            confirmModal.classList.remove('visible');
            if (confirmed && currentConfirmCallbacks.onConfirm) {
                currentConfirmCallbacks.onConfirm();
            } else if (!confirmed && currentConfirmCallbacks.onCancel) {
                currentConfirmCallbacks.onCancel();
            }
            currentConfirmCallbacks = { onConfirm: null, onCancel: null };
        }

        // Modal 事件監聽
        confirmOkBtn.addEventListener('click', () => hideConfirmModal(true));
        confirmCancelBtn.addEventListener('click', () => hideConfirmModal(false));

        // 背景點擊關閉
        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) hideConfirmModal(false);
        });

        // 鍵盤事件：Escape 關閉、Enter 確認
        document.addEventListener('keydown', (e) => {
            if (!confirmModal.classList.contains('visible')) return;
            if (e.key === 'Escape') {
                e.preventDefault();
                hideConfirmModal(false);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                hideConfirmModal(true);
            }
        });

        function updateUI() {
            btnUndo.disabled = historyStack.length === 0;
            btnRedo.disabled = redoStack.length === 0;
        }

        // ===== 自動存檔 =====
        function autoSave() {
            saveProgress();
        }

        function saveProgress() {
            try {
                const data = localStorage.getItem(AUTOSAVE_KEY);
                const saved = data ? JSON.parse(data) : {};
                saved[currentImageIndex] = drawCanvas.toDataURL('image/png');
                localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(saved));
            } catch (e) {
                console.warn('自動存檔失敗:', e);
            }
        }

        function loadSavedProgress() {
            try {
                const data = localStorage.getItem(AUTOSAVE_KEY);
                if (!data) return;

                const saved = JSON.parse(data);
                const imgData = saved[currentImageIndex];
                if (!imgData) return;

                const img = new Image();
                img.onload = () => {
                    drawCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    drawCtx.drawImage(img, 0, 0);
                };
                img.src = imgData;
            } catch (e) {
                console.warn('載入存檔失敗:', e);
            }
        }

        // ===== 儲存圖片 =====
        function saveImage() {
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = CANVAS_SIZE;
            exportCanvas.height = CANVAS_SIZE;
            const exportCtx = exportCanvas.getContext('2d');
            exportCtx.drawImage(baseCanvas, 0, 0);
            exportCtx.drawImage(drawCanvas, 0, 0);

            const link = document.createElement('a');
            const date = new Date();
            const timestamp = `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}_${String(date.getHours()).padStart(2,'0')}${String(date.getMinutes()).padStart(2,'0')}`;
            link.download = `KidsArt_${timestamp}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();

            sound.playSave();
            showToast('💾 已儲存到相簿！');
        }

        // ===== 分享功能 =====
        function toggleShareMenu(show) {
            shareMenu.classList.toggle('visible', show);
            if (show) sound.playSwitch();
        }

        // 複製圖片到剪貼簿
        async function copyImageToClipboard() {
            try {
                // 1. 合併兩層 canvas
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = CANVAS_SIZE;
                exportCanvas.height = CANVAS_SIZE;
                const exportCtx = exportCanvas.getContext('2d');
                exportCtx.drawImage(baseCanvas, 0, 0);
                exportCtx.drawImage(drawCanvas, 0, 0);

                // 2. 轉成 Blob
                const blob = await new Promise((resolve, reject) => {
                    exportCanvas.toBlob(blob => {
                        if (blob) resolve(blob);
                        else reject(new Error('Canvas to Blob failed'));
                    }, 'image/png');
                });

                // 3. 寫入剪貼簿
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);

                // 4. 成功回饋
                sound.playSave();
                showToast('✅ 已複製！可以貼到任何地方囉～');
                return true;

            } catch (err) {
                console.error('複製圖片失敗:', err);
                return false;
            }
        }

        // 處理複製圖片（含 fallback）
        async function handleCopyImage() {
            // 檢查瀏覽器支援
            if (!navigator.clipboard?.write || !window.ClipboardItem) {
                sound.playError?.() || sound.playClear();
                showToast('😅 你的瀏覽器不支援複製，幫你下載囉！');
                saveImage();
                return;
            }

            const success = await copyImageToClipboard();
            
            if (!success) {
                sound.playError?.() || sound.playClear();
                showToast('😅 複製失敗了，幫你下載囉！');
                saveImage();
            }
        }

        function handleShare(type) {
            switch (type) {
                case 'copy':
                    handleCopyImage();
                    break;
                case 'download':
                    saveImage();
                    break;
            }
            toggleShareMenu(false);
        }

        // ===== 工具函數 =====
        function showLoading(show) {
            loadingEl.classList.toggle('visible', show);
        }

        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.add('visible');
            setTimeout(() => toastEl.classList.remove('visible'), 2000);
        }

        // 啟動！
        init();
    </script>
</body>
</html>
