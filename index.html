<html lang="zh-TW">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Coloring Master - V4.0 Multi-Image</title>
    <style>
        /* --- CSS 佈局核心 --- */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: "Varela Round", sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overscroll-behavior: none;
            user-select: none;
        }

        /* 1. 頂部工具列 */
        #toolbar {
            height: 7vh; /* 稍微縮小讓位給圖片選單 */
            min-height: 45px;
            max-height: 60px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 10;
            flex-shrink: 0;
        }

        /* 2. 新增：圖片導覽列 (Image Selector) */
        #image-nav {
            height: 9vh;
            min-height: 60px;
            max-height: 90px;
            background: #fff;
            display: flex;
            justify-content: center; /* 圖片少時置中 */
            align-items: center;
            gap: 12px;
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
            flex-shrink: 0;
            overflow-x: auto; /* 支援橫向捲動 */
            scrollbar-width: none; 
        }
        #image-nav::-webkit-scrollbar { display: none; }

        /* 導覽列的小縮圖樣式 */
        .nav-thumb {
            height: 80%;
            aspect-ratio: 1/1;
            object-fit: contain;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 2px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        .nav-thumb:active { transform: scale(0.9); }
        .nav-thumb.active {
            border-color: #007aff; /* 選中時變藍色框 */
            border-width: 3px;
            box-shadow: 0 2px 8px rgba(0,122,255,0.3);
            transform: scale(1.05);
        }

        /* 3. 畫布容器 */
        #canvas-container {
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #eef2f5;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            touch-action: none;
            cursor: crosshair;
        }

        /* 4. 底部色票區 */
        #palette {
            height: 12vh;
            min-height: 70px;
            max-height: 120px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 1.5vh;
            background: #fff;
            padding: 0 15px;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            flex-shrink: 0;
            overflow-x: auto; 
            overflow-y: hidden;
            scrollbar-width: thin; 
            scrollbar-color: #ddd transparent;
        }

        #palette::-webkit-scrollbar { height: 6px; }
        #palette::-webkit-scrollbar-thumb { background-color: #ddd; border-radius: 10px; }
        #palette::-webkit-scrollbar-track { background: transparent; }

        @media (pointer: coarse) {
            #palette { scrollbar-width: none; }
            #palette::-webkit-scrollbar { display: none; }
        }

        .color-swatch {
            height: 65%;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            flex-shrink: 0;
        }
        .color-swatch.active { transform: scale(1.15); border-color: #333; }

        .btn {
            background: #eef2f5;
            border: none;
            border-radius: 12px;
            height: 70%;
            aspect-ratio: 1/1;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        .btn:active { transform: scale(0.9); background: #dce4e8; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .btn-save { background: #4CD964; color: white; width: auto; aspect-ratio: auto; padding: 0 20px; font-weight: bold; font-size: 1rem; }
        .tool-group { display: flex; gap: 10px; height: 100%; align-items: center; }

        @media (min-width: 768px) {
            #canvas-container { padding: 20px; }
        }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W2FV7ZPZ"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <div id="toolbar">
        <div class="tool-group">
            <button id="btn-undo" class="btn" title="復原">↩️</button>
            <button id="btn-redo" class="btn" title="重做">↪️</button>
        </div>
        <button id="btn-save" class="btn btn-save" title="儲存圖片">💾 儲存</button>
    </div>

    <div id="image-nav">
        </div>

    <div id="canvas-container">
        <canvas id="drawing-canvas"></canvas>
    </div>

    <div id="palette"></div>

    <script>
        // --- 參數設定 ---
        // ⚠️ 請確保這 5 張圖片真實存在於您的資料夾中
        const IMAGES = [
            'img1.png', 
            'img2.png', 
            'img3.png', 
            'img4.png', 
            'img5.png'
        ];
        
        let currentImageIndex = 0; // 目前選中的圖片索引

        const TOLERANCE = 50; 
        const MAX_HISTORY = 10; 
        // 嚴格定義：小於 50 的顏色絕對是線條，神聖不可侵犯
        const LINE_THRESHOLD = 50; 

        // --- DOM ---
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const paletteContainer = document.getElementById('palette');
        const navContainer = document.getElementById('image-nav'); // 新增導覽列容器
        const btnUndo = document.getElementById('btn-undo');
        const btnRedo = document.getElementById('btn-redo');
        const btnSave = document.getElementById('btn-save');
        
        let currentColor = [255, 59, 48, 255]; 
        const baseWidth = 800;
        const baseHeight = 800; 
        
        let historyStack = [];
        let redoStack = [];

        function init() {
            canvas.width = baseWidth;
            canvas.height = baseHeight;
            
            createPalette();
            createImageNav(); // 建立圖片選單
            loadLineArt(IMAGES[currentImageIndex]); // 載入第一張圖
            updateUI();

            canvas.addEventListener('pointerdown', handleCanvasClick);
            btnUndo.addEventListener('click', undo);
            btnRedo.addEventListener('click', redo);
            btnSave.addEventListener('click', saveImage);

            paletteContainer.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    paletteContainer.scrollLeft += e.deltaY;
                }
            }, { passive: false });
        }

        // --- 新增：建立圖片導覽列 ---
        function createImageNav() {
            navContainer.innerHTML = ''; // 清空
            IMAGES.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = `nav-thumb ${index === currentImageIndex ? 'active' : ''}`;
                img.onclick = () => switchImage(index);
                navContainer.appendChild(img);
            });
        }

        // --- 新增：切換圖片邏輯 ---
        function switchImage(index) {
            if (index === currentImageIndex) return; // 如果點同一個就不重載

            // 更新狀態
            currentImageIndex = index;
            
            // 更新 UI 顯示 (邊框)
            document.querySelectorAll('.nav-thumb').forEach((el, i) => {
                if (i === index) el.classList.add('active');
                else el.classList.remove('active');
            });

            // 清空歷史紀錄 (避免 Undo 回到上一張圖)
            historyStack = [];
            redoStack = [];
            updateUI();

            // 載入新圖
            loadLineArt(IMAGES[index]);
        }

        function createPalette() {
            const colors = [
                [255, 59, 48], [255, 105, 180], [255, 182, 193], [220, 20, 60],
                [255, 149, 0], [255, 165, 0], [255, 204, 0], [255, 255, 0], [240, 230, 140],
                [255, 228, 196], [255, 218, 185], [210, 180, 140], [139, 69, 19],
                [76, 217, 100], [124, 252, 0], [34, 139, 34], [0, 128, 128],
                [90, 200, 250], [0, 191, 255], [0, 122, 255], [0, 0, 139],
                [88, 86, 214], [148, 0, 211], [221, 160, 221],
                [255, 255, 255], [211, 211, 211], [150, 150, 150],
                [105, 105, 105], [60, 60, 60], [55, 55, 55] 
            ];

            colors.forEach((c, index) => {
                const div = document.createElement('div');
                div.className = `color-swatch ${index === 0 ? 'active' : ''}`;
                div.style.backgroundColor = `rgb(${c[0]},${c[1]},${c[2]})`;
                div.addEventListener('click', () => {
                    document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    currentColor = [...c, 255];
                });
                paletteContainer.appendChild(div);
            });
        }

        // --- 核心邏輯 ---
        function loadLineArt(filename) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = filename; // 改為讀取參數傳入的檔名
            img.onload = function() {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                const w = img.width * scale;
                const h = img.height * scale;
                const x = (canvas.width - w) / 2;
                const y = (canvas.height - h) / 2;
                ctx.drawImage(img, x, y, w, h);
            };
            img.onerror = function() { console.error(`找不到圖片: ${filename}`); };
        }

        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);
            floodFill(x, y, currentColor);
        }

        // 🏆 修正後的填色演算法 (保留邊界守衛)
        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            const startPos = (startY * canvas.width + startX) * 4;
            const startR = pixels[startPos];
            const startG = pixels[startPos + 1];
            const startB = pixels[startPos + 2];

            // 1. 點擊相似顏色 -> 不做
            if (colorsAreSimilar(startR, startG, startB, fillColor[0], fillColor[1], fillColor[2], 20)) return;
            
            // 2. 點擊到真正的線條 -> 不做
            if (isBlackOutline(startR, startG, startB)) return;

            saveState();

            const queue = [[startX, startY]];
            const visited = new Uint8Array(canvas.width * canvas.height); 
            
            while (queue.length > 0) {
                const [x, y] = queue.shift();
                const pixelIndex = y * canvas.width + x;
                
                if (visited[pixelIndex]) continue;
                visited[pixelIndex] = 1;

                const pixelPos = pixelIndex * 4;
                const r = pixels[pixelPos];
                const g = pixels[pixelPos + 1];
                const b = pixels[pixelPos + 2];

                // 🛑 核心修正：邊界守衛 🛑
                if (isBlackOutline(r, g, b)) {
                    continue; 
                }

                if (colorsAreSimilar(r, g, b, startR, startG, startB, TOLERANCE)) {
                    pixels[pixelPos] = fillColor[0];
                    pixels[pixelPos + 1] = fillColor[1];
                    pixels[pixelPos + 2] = fillColor[2];
                    pixels[pixelPos + 3] = 255; 
                    
                    if (x > 0) queue.push([x - 1, y]);
                    if (x < canvas.width - 1) queue.push([x + 1, y]);
                    if (y > 0) queue.push([x, y - 1]);
                    if (y < canvas.height - 1) queue.push([x, y + 1]);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function saveState() {
            redoStack = []; 
            if (historyStack.length >= MAX_HISTORY) historyStack.shift();
            historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            updateUI();
        }

        function undo() {
            if (historyStack.length === 0) return;
            redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const previousState = historyStack.pop();
            ctx.putImageData(previousState, 0, 0);
            updateUI();
        }

        function redo() {
            if (redoStack.length === 0) return;
            historyStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const nextState = redoStack.pop();
            ctx.putImageData(nextState, 0, 0);
            updateUI();
        }

        function updateUI() {
            btnUndo.disabled = historyStack.length === 0;
            btnRedo.disabled = redoStack.length === 0;
        }

        function saveImage() {
            const link = document.createElement('a');
            const date = new Date();
            const timestamp = `${date.getFullYear()}${date.getMonth()+1}${date.getDate()}_${date.getHours()}${date.getMinutes()}`;
            link.download = `KidsArt_${timestamp}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function colorsAreSimilar(r1, g1, b1, r2, g2, b2, tol) {
            return (Math.abs(r1 - r2) + Math.abs(g1 - g2) + Math.abs(b1 - b2)) <= tol;
        }

        function isBlackOutline(r, g, b) {
            return r < LINE_THRESHOLD && g < LINE_THRESHOLD && b < LINE_THRESHOLD; 
        }

        init();
    </script>
</body>
</html>
